<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1620">
<meta name="description" content="Blocktown is a 3D city-builder that runs in your browser. Paint roads, zone homes, shops and factories, and grow a skyline.">
<title>Blocktown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
[hidden]{display:none!important}
:root{
  /* Layout: full-bleed 3D viewport, slim stat strip on top, tool rail on the left, city panel on the right. */
  --ink:#0d1620;
  --panel:rgba(13,22,32,.86);
  --edge:rgba(170,200,222,.18);
  --text:#e9f1f5;
  --mute:#8ea5b4;
  --amber:#ffb347;
  --res:#62c780;
  --com:#4ca6ee;
  --ind:#ebb84a;
  --bad:#f0695a;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--text);font:14px/1.35 var(--body);-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;overflow:hidden}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:8px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
button{font:inherit;color:inherit;cursor:pointer}
h3{margin:0 0 6px;font:600 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;align-items:baseline}
h3 output{color:var(--text);letter-spacing:.02em;font-size:13px;text-transform:none}

#top{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 10px}
.brand b{display:block;font:800 24px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.brand small{display:block;color:var(--mute);font-size:11px;margin-top:2px}
.stat{padding:6px 12px;min-width:78px;border:1px solid var(--edge);text-align:left}
.stat small{display:block;color:var(--mute);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px}
.stat b{display:block;font:800 22px/1 var(--display);letter-spacing:.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--bad)}
#sideBtn{display:none}

#tools{position:absolute;left:12px;top:calc(88px + env(safe-area-inset-top,0px));width:178px;padding:6px;display:flex;flex-direction:column;gap:2px}
.tool{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:0;background:transparent;text-align:left;border-radius:6px}
.tool:hover{background:rgba(255,255,255,.06)}
.tool.on{background:rgba(255,179,71,.16);box-shadow:inset 0 0 0 1px rgba(255,179,71,.6)}
.tool i{width:14px;height:14px;border-radius:3px;display:block}
.tool .nm{font-weight:500}
.tool .cost{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.tool.poor .cost{color:var(--bad)}

#side{position:absolute;right:12px;top:calc(88px + env(safe-area-inset-top,0px));width:232px;padding:14px;display:flex;flex-direction:column;gap:16px}
.dem{display:flex;gap:10px}
.dcol{flex:1;display:flex;flex-direction:column;gap:5px;align-items:center;font-size:11px;color:var(--mute)}
.dtrack{position:relative;height:64px;width:100%;background:rgba(255,255,255,.05);border-radius:4px}
.dtrack::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.25)}
.dtrack i{position:absolute;left:5px;right:5px;border-radius:2px;transition:height .4s,opacity .4s}
input[type=range]{width:100%;accent-color:var(--amber);margin:2px 0 0}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.seg button{padding:6px 0;border:1px solid var(--edge);background:transparent;border-radius:5px;font-size:12px}
.seg button.on{background:rgba(255,179,71,.18);border-color:rgba(255,179,71,.6)}
dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:13px}
dt{color:var(--mute)} dd{margin:0;font-variant-numeric:tabular-nums;text-align:right}
.bar{height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin:6px 0 5px}
.bar i{display:block;height:100%;background:var(--amber);width:0;transition:width .5s}
#rank{font:800 22px/1 var(--display);letter-spacing:.05em;text-transform:uppercase}
#rankNext{color:var(--mute);font-size:12px}
#reset,#grow{width:100%;padding:8px;border:1px solid var(--edge);background:transparent;border-radius:6px;color:var(--mute);font-size:12px}
#grow{color:var(--text);border-color:rgba(255,179,71,.5)}
#grow:hover{background:rgba(255,179,71,.14)}
#reset.arm{border-color:var(--bad);color:var(--bad)}

#tip{position:fixed;z-index:5;padding:6px 9px;font-size:12px;pointer-events:none;white-space:nowrap}
#toast{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:9px 16px;font-size:13px;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(60px + env(safe-area-inset-bottom,0px));color:rgba(255,255,255,.7);font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none;white-space:nowrap}

#tools{max-height:calc(100% - 100px);overflow-y:auto}
.tool.lock{opacity:.5}
#goalText{font-weight:500;margin-bottom:2px}
#goalNote{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
#goalBox .bar i{background:var(--res)}
#goalBox h3 output{color:var(--amber)}
@media (max-width:820px){
  #sideBtn{display:block;cursor:pointer;color:var(--amber)}
  .brand small{display:none}
  .hide-sm{display:none}
  .brand b{font-size:19px}
  .brand svg{width:22px;height:22px}
  .stat small{font-size:9px}
  .stat{min-width:0;padding:5px 9px}
  .stat b{font-size:18px}
  #tools{top:auto;left:8px;right:8px;width:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));flex-direction:row;overflow-x:auto;gap:4px}
  .tool{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:74px;padding:7px 6px;text-align:center}
  .tool .nm{font-size:12px;white-space:nowrap}
  .tool .cost{font-size:11px}
  .tool kbd{display:none}
  #side{display:none;left:12px;right:12px;width:auto;top:auto;bottom:calc(92px + env(safe-area-inset-bottom,0px));max-height:52vh;overflow:auto}
  body.show-side #side{display:flex}
  #toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  #hint{display:none}
}
@media (prefers-reduced-motion:reduce){.dtrack i,.bar i{transition:none}}
</style>

</head>
<body>
<div id="app">
  <header id="top">
    <div class="panel brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="2" y="14" width="7" height="14" fill="#4ca6ee"/><rect x="11" y="5" width="8" height="23" fill="#ffb347"/><rect x="21" y="11" width="7" height="17" fill="#62c780"/></svg>
      <div><b>Blocktown</b><small id="cityName">&nbsp;</small></div>
    </div>
    <div class="panel stat"><small>Date</small><b id="date">Y1 · Jan</b></div>
    <div class="panel stat hide-sm"><small>Clock</small><b id="clock">10:00</b></div>
    <div class="panel stat"><small>Funds</small><b id="money">$0</b></div>
    <div class="panel stat"><small>Residents</small><b id="pop">0</b></div>
    <div class="panel stat"><small>Mood</small><b id="mood">0%</b></div>
    <div class="panel stat"><small>Power MW</small><b id="power">0/0</b></div>
    <button class="panel stat" id="sideBtn"><small>Panel</small><b>City</b></button>
  </header>

  <nav id="tools" class="panel" aria-label="Tools"></nav>

  <aside id="side" class="panel">
    <section id="goalBox">
      <h3>Goal <output id="goalReward"></output></h3>
      <div id="goalText">&nbsp;</div>
      <div class="bar"><i id="goalBar"></i></div>
      <div id="goalNote"></div>
    </section>
    <section>
      <h3>Zone demand</h3>
      <div class="dem">
        <div class="dcol"><div class="dtrack"><i id="dR" style="background:var(--res)"></i></div>Res</div>
        <div class="dcol"><div class="dtrack"><i id="dC" style="background:var(--com)"></i></div>Com</div>
        <div class="dcol"><div class="dtrack"><i id="dI" style="background:var(--ind)"></i></div>Ind</div>
      </div>
    </section>
    <section>
      <h3>Tax rate <output id="taxO">9%</output></h3>
      <input id="tax" type="range" min="4" max="16" value="9" aria-label="Tax rate">
    </section>
    <section>
      <h3>Speed</h3>
      <div class="seg" id="speed">
        <button data-s="0">Pause</button><button data-s="1" class="on">1x</button><button data-s="2">2x</button><button data-s="4">4x</button>
      </div>
    </section>
    <section>
      <h3>Last month</h3>
      <dl><dt>Taxes</dt><dd id="bInc">—</dd><dt>Upkeep</dt><dd id="bExp">—</dd><dt>Net</dt><dd id="bNet">—</dd></dl>
    </section>
    <section>
      <h3>Rank</h3>
      <div id="rank">Hamlet</div>
      <div class="bar"><i id="rankBar"></i></div>
      <div id="rankNext"></div>
    </section>
    <button id="grow">Grow city (free burst of new lots)</button>
    <button id="reset">Start a new city</button>
  </aside>

  <div id="hint">Drag to paint roads and zones. Right-drag to orbit, wheel to zoom, WASD to pan.</div>
  <div id="tip" class="panel" hidden></div>
  <div id="toast" class="panel" hidden></div>
</div>

<script src="/vendor/three.min.js"></script>
<script src="/vendor/fx/CopyShader.js"></script>
<script src="/vendor/fx/LuminosityHighPassShader.js"></script>
<script src="/vendor/fx/EffectComposer.js"></script>
<script src="/vendor/fx/MaskPass.js"></script>
<script src="/vendor/fx/RenderPass.js"></script>
<script src="/vendor/fx/ShaderPass.js"></script>
<script src="/vendor/fx/UnrealBloomPass.js"></script>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
if(!window.THREE){var t=$('toast');t.hidden=false;t.textContent='The 3D engine could not load. Check your connection and reload.';return;}

/* ---------- constants ---------- */
var N=36,HALF=N/2,DAY=0.7,SAVE='blocktown-save-v1';
var T={E:0,ROAD:1,RES:2,COM:3,IND:4,POWER:5,PARK:6,FIRE:7,STADIUM:8,SPIRE:9};
var NAMES=['Empty','Road','Residential','Commercial','Industrial','Power plant','Park','Fire station','Stadium','Spire'];
var RES_POP=[0,8,22,48],COM_JOBS=[0,5,14,34],IND_JOBS=[0,9,22,45];
var USE_R=[0,1,3,6],USE_C=[0,2,5,11],USE_I=[0,3,7,14],PLANT_MW=80;
var TOOLS=[
 {id:'orbit',name:'Look around',cost:0,color:'#8ea5b4',key:'1'},
 {id:'road',name:'Road',cost:10,color:'#6c747d',t:T.ROAD,key:'2'},
 {id:'res',name:'Residential',cost:50,color:'#62c780',t:T.RES,key:'3'},
 {id:'com',name:'Commercial',cost:80,color:'#4ca6ee',t:T.COM,key:'4'},
 {id:'ind',name:'Industrial',cost:80,color:'#ebb84a',t:T.IND,key:'5'},
 {id:'power',name:'Power plant',cost:600,color:'#f4e04d',t:T.POWER,key:'6'},
 {id:'park',name:'Park',cost:40,color:'#3da45a',t:T.PARK,key:'7'},
 {id:'fire',name:'Fire station',cost:500,color:'#c8402f',t:T.FIRE,key:'f'},
 {id:'stadium',name:'Stadium',cost:3500,color:'#d9a441',t:T.STADIUM,rank:3,key:'g'},
 {id:'spire',name:'Spire',cost:9000,color:'#7fd0ff',t:T.SPIRE,rank:4,key:'h'},
 {id:'bull',name:'Bulldoze',cost:5,color:'#f0695a',key:'8'}
];
var RANKS=[[0,'Hamlet'],[100,'Village'],[400,'Town'],[1000,'Large town'],[2500,'City'],[6000,'Metropolis'],[12000,'Megacity']];
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var CITY_NAMES=['Ashford','Brindle Bay','Carrow','Dunmere','Eastholm','Fenwick','Garnet Point','Harlow','Kestrel Cove','Marlow'];
var DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
var FIRE_R=6;
var GOALS=[
 {t:'Build a fire station',r:1000,max:1,cur:function(s){return s.stations}},
 {t:'Reach 300 residents',r:1500,max:300,cur:function(s){return s.pop}},
 {t:'Plant 6 parks',r:1000,max:6,cur:function(s){return s.parks}},
 {t:'Create 500 jobs',r:2500,max:500,cur:function(s){return s.jobs}},
 {t:'Reach 1,000 residents',r:4000,max:1000,cur:function(s){return s.pop}},
 {t:'Build a stadium',r:3000,max:1,cur:function(s){return s.stadiums}},
 {t:'Reach 2,500 residents',r:8000,max:2500,cur:function(s){return s.pop}},
 {t:'Raise the Spire',r:10000,max:1,cur:function(s){return s.spires}},
 {t:'Reach 6,000 residents',r:20000,max:6000,cur:function(s){return s.pop}},
 {t:'Bank $100,000',r:25000,max:100000,cur:function(){return Math.floor(money)}}
];

/* ---------- state ---------- */
var money=20000,day=0,speed=1,tax=9,happy=62,tod=0.42,time=0,simAcc=0,cityName=CITY_NAMES[(Math.random()*CITY_NAMES.length)|0];
var stats={pop:0,jobs:0,com:0,ind:0,use:0,supply:0,roads:0,plants:0,parks:0,dem:{r:1,c:0,i:0}};
var budget={inc:0,exp:0,has:false};
var goalIdx=0,rankIdx=0,curTool=TOOLS[1];
var grid=[];for(var i=0;i<N*N;i++)grid.push({t:0,l:0,obj:null,plot:null,road:null});
function idx(x,z){return z*N+x}
function inb(x,z){return x>=0&&z>=0&&x<N&&z<N}
function roadAt(x,z){return inb(x,z)&&grid[idx(x,z)].t===T.ROAD}
function hasRoad(x,z){for(var d=0;d<4;d++){if(roadAt(x+DIRS[d][0],z+DIRS[d][1]))return true}return false}
function rng(seed){var a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;var t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function pick(arr,r){return arr[Math.floor(r()*arr.length)]}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}

/* ---------- renderer / scene ---------- */
var renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
var el=renderer.domElement;el.id='view';$('app').insertBefore(el,$('app').firstChild);
var scene=new THREE.Scene();
scene.background=new THREE.Color('#8cc5ec');
scene.fog=new THREE.Fog('#8cc5ec',70,170);
var camera=new THREE.PerspectiveCamera(42,1,0.5,400);
var cam={yaw:0.78,pitch:0.78,dist:34,tx:0,tz:0};
function applyCam(){
  var cp=Math.cos(cam.pitch);
  camera.position.set(cam.tx+cam.dist*cp*Math.sin(cam.yaw),cam.dist*Math.sin(cam.pitch),cam.tz+cam.dist*cp*Math.cos(cam.yaw));
  camera.lookAt(cam.tx,0,cam.tz);
}
function resize(){
  var w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h,false);el.style.width='100%';el.style.height='100%';
  camera.aspect=w/h;camera.updateProjectionMatrix();
  if(composer)fxSize(w,h);
}
window.addEventListener('resize',resize);resize();

/* ---------- post-processing: bloom, miniature blur, vignette ---------- */
var composer=null,bloom=null,grade=null,fxOn=true,fxAcc=0,fxN=0;
var GradeShader={
  uniforms:{tDiffuse:{value:null},res:{value:new THREE.Vector2(1280,800)},vig:{value:.3},sat:{value:1.12},con:{value:1.07}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform sampler2D tDiffuse;uniform vec2 res;uniform float vig,sat,con;varying vec2 vUv;void main(){vec4 c=texture2D(tDiffuse,vUv);float t=smoothstep(.2,.5,abs(vUv.y-.45));float r=t*3.2;vec3 acc=c.rgb;if(r>.4){for(int i=0;i<8;i++){float a=float(i)*.785398;acc+=texture2D(tDiffuse,vUv+vec2(cos(a),sin(a))*r/res).rgb;}acc/=9.;}float l=dot(acc,vec3(.299,.587,.114));vec3 col=mix(vec3(l),acc,sat);col=(col-.5)*con+.5;float v=smoothstep(.9,.3,length((vUv-.5)*vec2(1.15,1.)));col*=mix(1.-vig,1.,v);gl_FragColor=vec4(col,c.a);}'
};
function fxSize(w,h){var pr=renderer.getPixelRatio();composer.setPixelRatio(pr);composer.setSize(w,h);grade.uniforms.res.value.set(w*pr,h*pr)}
function initFX(){
  try{
    var w=window.innerWidth,h=window.innerHeight,pr=renderer.getPixelRatio();
    var rt=renderer.capabilities.isWebGL2?new THREE.WebGLMultisampleRenderTarget(w*pr,h*pr,{format:THREE.RGBAFormat}):undefined;
    composer=new THREE.EffectComposer(renderer,rt);
    composer.addPass(new THREE.RenderPass(scene,camera));
    bloom=new THREE.UnrealBloomPass(new THREE.Vector2(w,h),.4,.55,.85);
    composer.addPass(bloom);
    grade=new THREE.ShaderPass(GradeShader);
    composer.addPass(grade);
    fxSize(w,h);
  }catch(e){composer=null;bloom=null;grade=null}
}
initFX();

var hemi=new THREE.HemisphereLight('#bfe0ff','#5d7a4a',0.7);scene.add(hemi);
var sun=new THREE.DirectionalLight('#fff1d6',1.05);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
var sc=sun.shadow.camera;sc.left=-30;sc.right=30;sc.top=30;sc.bottom=-30;sc.near=1;sc.far=170;
sun.shadow.bias=-0.0006;sun.shadow.normalBias=0.03;
scene.add(sun);scene.add(sun.target);
var moon=new THREE.DirectionalLight('#6f8fff',0);scene.add(moon);

var world=new THREE.Group();scene.add(world);
var rippleTex=null,foamMesh=null;

/* island, water, grid */
(function(){
  var water=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshStandardMaterial({color:'#2d7393',roughness:.35,metalness:.1}));
  water.rotation.x=-Math.PI/2;water.position.y=-0.55;water.receiveShadow=false;scene.add(water);
  var rc=document.createElement('canvas');rc.width=rc.height=128;var rg=rc.getContext('2d'),rr=rng(5);
  rg.strokeStyle='rgba(255,255,255,.55)';rg.lineWidth=2;
  for(var k=0;k<26;k++){var rx=rr()*128,ry=rr()*128,rl=8+rr()*18;rg.beginPath();rg.moveTo(rx,ry);rg.quadraticCurveTo(rx+rl/2,ry-3,rx+rl,ry);rg.stroke()}
  var rt=new THREE.CanvasTexture(rc);rt.wrapS=rt.wrapT=THREE.RepeatWrapping;rt.repeat.set(70,70);
  var ripple=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshBasicMaterial({map:rt,transparent:true,opacity:.22,depthWrite:false}));
  ripple.rotation.x=-Math.PI/2;ripple.position.y=-0.53;scene.add(ripple);rippleTex=rt;
  function ringTex(size,fn){var c=document.createElement('canvas');c.width=c.height=size;var g=c.getContext('2d');fn(g,size);return new THREE.CanvasTexture(c)}
  var shT=ringTex(256,function(g,S){for(var i=0;i<=28;i++){var a=Math.pow(i/28,1.7)*.62;g.strokeStyle='rgba(120,222,214,'+a.toFixed(3)+')';g.lineWidth=2;g.strokeRect(i+1,i+1,S-2*i-2,S-2*i-2)}});
  var shallows=new THREE.Mesh(new THREE.PlaneGeometry(46,46),new THREE.MeshBasicMaterial({map:shT,transparent:true,depthWrite:false}));
  shallows.rotation.x=-Math.PI/2;shallows.position.y=-.5;scene.add(shallows);
  var fT=ringTex(256,function(g,S){g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=6;g.strokeRect(7,7,S-14,S-14);g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=10;g.strokeRect(11,11,S-22,S-22)});
  foamMesh=new THREE.Mesh(new THREE.PlaneGeometry(38,38),new THREE.MeshBasicMaterial({map:fT,transparent:true,opacity:.6,depthWrite:false}));
  foamMesh.rotation.x=-Math.PI/2;foamMesh.position.y=-.48;scene.add(foamMesh);
  var base=new THREE.Mesh(new THREE.BoxGeometry(N+0.6,0.8,N+0.6),new THREE.MeshStandardMaterial({color:'#b79a6c',roughness:.95}));
  base.position.y=-0.41;base.receiveShadow=true;scene.add(base);
  var c=document.createElement('canvas');var px=8;c.width=c.height=N*px;var g=c.getContext('2d');
  var r=rng(7);
  for(var z=0;z<N;z++)for(var x=0;x<N;x++){
    var l=32+r()*6;g.fillStyle='hsl('+(96+r()*10)+',30%,'+l+'%)';g.fillRect(x*px,z*px,px,px);
    if(r()<.35){g.fillStyle='rgba(255,255,255,.08)';g.fillRect(x*px+r()*6,z*px+r()*6,2,2)}

/* ---------- simulation ---------- */
function computeStats(){
  var resCap=0,com=0,ind=0,plants=0,parks=0,roads=0,use=0,polluted=0,stations=0,stadiums=0,spires=0,st=[],x,z,c;
  for(z=0;z<N;z++)for(x=0;x<N;x++){
    c=grid[idx(x,z)];
    switch(c.t){
      case T.ROAD:roads++;break;
      case T.RES:resCap+=RES_POP[c.l];use+=USE_R[c.l];break;
      case T.COM:com+=COM_JOBS[c.l];use+=USE_C[c.l];break;
      case T.IND:ind+=IND_JOBS[c.l];use+=USE_I[c.l];break;
      case T.POWER:plants++;break;
      case T.PARK:parks++;break;
      case T.FIRE:stations++;st.push([x,z]);use+=2;break;
      case T.STADIUM:stadiums++;use+=20;break;
      case T.SPIRE:spires++;use+=12;break;
    }
  }
  for(z=0;z<N;z++)for(x=0;x<N;x++){
    c=grid[idx(x,z)];if(c.t!==T.RES||!c.l)continue;
    var p=0;
    for(var dz=-3;dz<=3;dz++)for(var dx=-3;dx<=3;dx++){
      if(!inb(x+dx,z+dz))continue;var o=grid[idx(x+dx,z+dz)];if(o.t===T.IND&&o.l)p+=.2*o.l;
    }
    polluted+=RES_POP[c.l]*Math.min(1,p);
  }
  var pf=resCap?polluted/resCap:0;
  var s={pop:0,jobs:com+ind,com:com,ind:ind,use:use,supply:plants*PLANT_MW,roads:roads,plants:plants,parks:parks,pf:pf,resCap:resCap,stations:stations,stadiums:stadiums,spires:spires,st:st};
  var brown=use>s.supply;
  var parkScore=18*Math.min(1,parks*60/(resCap+60));
  var target=64+parkScore-30*pf-(tax-9)*2.5-(brown?18:0)-((resCap>s.jobs*1.5+10)?8:0)+Math.min(14,stadiums*7+spires*5)-Math.min(10,Object.keys(fires).length*4);
  happy+=(clamp(target,5,98)-happy)*.2;
  s.pop=Math.round(resCap*(.55+.45*happy/100));
  var pop=s.pop,jobs=s.jobs,adj=-(tax-9)*.03+(happy-60)/200;
  s.dem={
    r:clamp((jobs+12-pop)/(jobs+pop+12)+adj,-1,1),
    c:clamp((pop*.3+6-com)/(pop*.3+com+6)+adj,-1,1),
    i:clamp((pop*.4+8-ind)/(pop*.4+ind+8)+adj,-1,1)
  };
  s.brown=brown;
  return s;
}
function simDay(){
  stats=computeStats();
  var s=stats,brown=s.brown,changed=false;
  for(var z=0;z<N;z++)for(var x=0;x<N;x++){
    var c=grid[idx(x,z)];
    if(c.t<T.RES||c.t>T.IND)continue;
    var d=c.t===T.RES?s.dem.r:c.t===T.COM?s.dem.c:s.dem.i;
    if(c.l>0&&(d<-.5||happy<22)&&Math.random()<.02){c.l--;spawnObj(c,x,z,0);changed=true;continue}
    if(!hasRoad(x,z)||brown)continue;
    if(c.l===0){if(d>.02&&Math.random()<.10+.25*d){c.l=1;spawnObj(c,x,z,0);changed=true}}
    else if(c.l<3){if(d>.2&&happy>45&&Math.random()<.012+.04*d){c.l++;spawnObj(c,x,z,0);changed=true}}
  }
  if(changed)stats=computeStats();
  day++;burnTick();
  if(day%10===0)monthly();
  checkGoal();syncCars();syncPeds();hud();
}
function checkGoal(){
  var G=GOALS[goalIdx];if(!G)return;
  if((G.cur(stats)||0)>=G.max){money+=G.r;goalIdx++;note('Goal complete: '+G.t+'. +$'+G.r.toLocaleString('en-US'));save()}
}
function monthly(){
  var s=stats;
  var inc=Math.round((s.pop*tax*.4+s.jobs*tax*.25)*.85)+s.stadiums*250+s.spires*600;
  var exp=s.roads*1+s.plants*30+s.parks*4+s.stations*25+s.stadiums*40+s.spires*60;
  money+=inc-exp;budget={inc:inc,exp:exp,has:true};
  note('Month closed: '+(inc-exp>=0?'+':'-')+'$'+Math.abs(inc-exp).toLocaleString('en-US'));
  save();
}

  for(var n=0;n<Math.min(6,cand.length);n++){
    var q=Math.random()*sum,t=q<w[0]?T.RES:(q<w[0]+w[1]?T.COM:T.IND),c=cand[n];
    setTile(c[0],c[1],t,0,n*.15);grid[idx(c[0],c[1])].l=1;spawnObj(grid[idx(c[0],c[1])],c[0],c[1],n*.15);lots++;
  }
  stats=computeStats();syncCars();syncPeds();hud();
  note(lots?'The city grew: '+lots+' new lots'+(made?' and '+made+' road tiles':''):'No room to grow here. Lay more road first.');
}
$('grow').addEventListener('click',growCity);
var resetT=0;
$('reset').addEventListener('click',function(){
  var b=$('reset');
  if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='Tap again to erase this city';resetT=setTimeout(function(){b.classList.remove('arm');b.textContent='Start a new city'},3000);return}
  clearTimeout(resetT);b.classList.remove('arm');b.textContent='Start a new city';newCity();
});

/* ---------- placing ---------- */
function canPlace(x,z){var c=grid[idx(x,z)];if(curTool.id==='orbit')return false;if(curTool.id==='bull')return c.t!==T.E;return c.t===T.E}
function applyTool(x,z){
  if(!inb(x,z)||!canPlace(x,z))return false;
  var tl=curTool;
  if(money<tl.cost){poor();return false}
  money-=tl.cost;
  if(tl.id==='bull'){clearTile(x,z)}
  else{
    setTile(x,z,tl.t,0,0);
    if(tl.t>=T.RES&&tl.t<=T.IND&&!hasRoad(x,z))note('Zones only grow next to a road.');
  }
  stats=computeStats();syncCars();syncPeds();hud();return true;
}
function lineTiles(x0,z0,x1,z1,fn){
  var dx=Math.abs(x1-x0),dz=Math.abs(z1-z0),sx=x0<x1?1:-1,sz=z0<z1?1:-1,e=dx-dz;
  for(;;){fn(x0,z0);if(x0===x1&&z0===z1)break;var e2=2*e;if(e2>-dz){e-=dz;x0+=sx}if(e2<dx){e+=dx;z0+=sz}}
}

/* ---------- input ---------- */
var ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),gp=new THREE.Plane(new THREE.Vector3(0,1,0),0),hit=new THREE.Vector3();
function tilePick(e){
  var r=el.getBoundingClientRect();ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);if(!ray.ray.intersectPlane(gp,hit))return null;
  var x=Math.floor(hit.x+HALF),z=Math.floor(hit.z+HALF);return inb(x,z)?{x:x,z:z}:null;
}
var mGeo=new THREE.PlaneGeometry(1,1);mGeo.rotateX(-Math.PI/2);
var marker=new THREE.Group();
var mFill=new THREE.Mesh(mGeo,new THREE.MeshBasicMaterial({color:'#62c780',transparent:true,opacity:.4,depthWrite:false}));
var mLine=new THREE.LineSegments(new THREE.EdgesGeometry(mGeo),new THREE.LineBasicMaterial({color:0xffffff}));
marker.add(mFill);marker.add(mLine);marker.position.y=.05;marker.visible=false;scene.add(marker);
var rGeo=new THREE.CircleGeometry(FIRE_R+.5,48);rGeo.rotateX(-Math.PI/2);
var mRing=new THREE.Mesh(rGeo,new THREE.MeshBasicMaterial({color:'#ff8a5a',transparent:true,opacity:.14,depthWrite:false}));mRing.position.y=.01;mRing.visible=false;marker.add(mRing);
function hover(t){
  if(!t||curTool.id==='orbit'){marker.visible=false;return}
  marker.visible=true;mRing.visible=curTool.id==='fire';marker.position.set(wx(t.x),.05,wx(t.z));
  mFill.material.color.set(canPlace(t.x,t.z)?(curTool.id==='bull'?'#f0695a':'#62c780'):'#888888');
}
var tip=$('tip');
function info(t){
  var c=grid[idx(t.x,t.z)],n=NAMES[c.t];
  if(fires[idx(t.x,t.z)])return n+' is on fire';
  if(c.t===T.E)return 'Empty land';
  if(c.t===T.RES)return c.l?'Residential, level '+c.l+' · '+RES_POP[c.l]+' homes':'Residential lot'+(hasRoad(t.x,t.z)?'':' · needs a road beside it');
  if(c.t===T.COM)return c.l?'Commercial, level '+c.l+' · '+COM_JOBS[c.l]+' jobs':'Commercial lot'+(hasRoad(t.x,t.z)?'':' · needs a road beside it');
  if(c.t===T.IND)return c.l?'Industrial, level '+c.l+' · '+IND_JOBS[c.l]+' jobs':'Industrial lot'+(hasRoad(t.x,t.z)?'':' · needs a road beside it');
  if(c.t===T.POWER)return 'Power plant · +'+PLANT_MW+' MW';
  if(c.t===T.FIRE)return 'Fire station · covers '+FIRE_R+' tiles';
  if(c.t===T.STADIUM)return 'Stadium · lifts mood, +$250/month';
  if(c.t===T.SPIRE)return 'Spire · lifts mood, +$600/month';
  return n;
}
var pointers=new Map(),drag=null,lastTile=null;
function dist2(){var a=Array.from(pointers.values());return {d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),mx:(a[0].x+a[1].x)/2,my:(a[0].y+a[1].y)/2}}
function panBy(dx,dy){
  var s=cam.dist*.0012,rx=Math.cos(cam.yaw),rz=-Math.sin(cam.yaw),fx=-Math.sin(cam.yaw),fz=-Math.cos(cam.yaw);
  cam.tx=clamp(cam.tx-rx*dx*s+fx*dy*s,-HALF,HALF);cam.tz=clamp(cam.tz-rz*dx*s+fz*dy*s,-HALF,HALF);
}
el.addEventListener('contextmenu',function(e){e.preventDefault()});
el.addEventListener('pointerdown',function(e){
  try{el.setPointerCapture(e.pointerId)}catch(_){}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){var p=dist2();drag={mode:'pinch',d:p.d,mx:p.mx,my:p.my};return}
  if(e.button===2||e.button===1||(e.button===0&&curTool.id==='orbit')){drag={mode:(e.shiftKey||e.button===1)?'pan':'orbit',x:e.clientX,y:e.clientY};el.style.cursor='grabbing';return}
  if(e.button===0){
    drag={mode:'paint'};var t=tilePick(e);hover(t);
    if(t){applyTool(t.x,t.z);lastTile=t}
  }
});
el.addEventListener('pointermove',function(e){
  if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(drag&&drag.mode==='pinch'&&pointers.size>=2){
    var p=dist2();cam.dist=clamp(cam.dist*drag.d/p.d,16,80);panBy(p.mx-drag.mx,p.my-drag.my);drag.d=p.d;drag.mx=p.mx;drag.my=p.my;return;
  }
  if(drag&&drag.mode==='orbit'){cam.yaw-=(e.clientX-drag.x)*.006;cam.pitch=clamp(cam.pitch+(e.clientY-drag.y)*.005,.35,1.38);drag.x=e.clientX;drag.y=e.clientY;return}
  if(drag&&drag.mode==='pan'){panBy(e.clientX-drag.x,e.clientY-drag.y);drag.x=e.clientX;drag.y=e.clientY;return}
  var t=tilePick(e);
  if(e.pointerType==='mouse'||drag){hover(t)}
  if(drag&&drag.mode==='paint'&&t){
    if(lastTile&&(lastTile.x!==t.x||lastTile.z!==t.z)){lineTiles(lastTile.x,lastTile.z,t.x,t.z,function(x,z){applyTool(x,z)})}
    lastTile=t;
  }
  if(e.pointerType==='mouse'&&t&&!drag){tip.hidden=false;tip.textContent=info(t);tip.style.left=Math.min(e.clientX+16,window.innerWidth-260)+'px';tip.style.top=(e.clientY+16)+'px'}
  else if(!t||drag){tip.hidden=true}
});
function endPtr(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2&&drag&&drag.mode==='pinch')drag=null;
  if(pointers.size===0){drag=null;lastTile=null;el.style.cursor=curTool.id==='orbit'?'grab':'crosshair'}
}
el.addEventListener('pointerup',endPtr);el.addEventListener('pointercancel',endPtr);
el.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse'&&!drag){tip.hidden=true;marker.visible=false}});
el.addEventListener('wheel',function(e){e.preventDefault();cam.dist=clamp(cam.dist*Math.exp(e.deltaY*.0012),16,80)},{passive:false});
var keys={};
window.addEventListener('keydown',function(e){
  if(e.target&&e.target.tagName==='INPUT'&&e.target.type!=='range')return;
  var k=e.key.toLowerCase();keys[k]=true;
  for(var i=0;i<TOOLS.length;i++){if(TOOLS[i].key===e.key){setTool(TOOLS[i].id);return}}
  if(k===' '){e.preventDefault();setSpeed(speed===0?1:0)}
  if(k==='x'&&composer){fxOn=!fxOn;fxAcc=0;fxN=0;note('Effects '+(fxOn?'on':'off'))}
});
window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false});
window.addEventListener('blur',function(){keys={}});

/* ---------- persistence + seeding ---------- */
function save(){
  try{
    var t='',l='';for(var i=0;i<grid.length;i++){t+=grid[i].t;l+=grid[i].l}
    localStorage.setItem(SAVE,JSON.stringify({v:1,t:t,l:l,money:money,day:day,tax:tax,happy:happy,tod:tod,name:cityName,goal:goalIdx}));
  }catch(_){}
}
function load(){
  try{
    var raw=localStorage.getItem(SAVE);if(!raw)return false;
    var d=JSON.parse(raw);if(!d||d.v!==1||d.t.length!==N*N||d.l.length!==N*N)return false;
    for(var i=0;i<N*N;i++){
      var t=+d.t[i],l=+d.l[i],x=i%N,z=Math.floor(i/N);
      if(t!==T.E){setTile(x,z,t,0,Math.random()*1.2);grid[i].l=l;if(l>0)spawnObj(grid[i],x,z,Math.random()*1.2)}
    }
    money=d.money;day=d.day;tax=d.tax;happy=d.happy;tod=d.tod;cityName=d.name||cityName;goalIdx=d.goal||0;
    return true;
  }catch(_){return false}
}
function seed(){
  var r=rng(11);
  function R(x0,x1,z){for(var x=x0;x<=x1;x++)add(x,z,T.ROAD,0)}
  function V(x,z0,z1){for(var z=z0;z<=z1;z++)add(x,z,T.ROAD,0)}
  function add(x,z,t,l){if(grid[idx(x,z)].t!==T.E)return;if(l&&r()<.22)l=0;setTile(x,z,t,0,r()*1.4);if(l){grid[idx(x,z)].l=l;spawnObj(grid[idx(x,z)],x,z,r()*1.4)}}
  R(8,28,18);V(18,8,28);R(10,26,24);V(12,18,24);V(24,18,24);
  var x;
  for(x=9;x<=17;x++)add(x,17,T.RES,r()<.35?2:1);
  for(x=9;x<=11;x++)add(x,19,T.RES,r()<.3?2:1);
  for(x=13;x<=17;x++){add(x,19,T.RES,r()<.3?2:1);add(x,23,T.RES,r()<.35?2:1)}
  for(x=19;x<=23;x++){add(x,17,T.COM,r()<.3?2:1);add(x,19,T.COM,1)}
  for(x=19;x<=25;x++)add(x,25,T.IND,1);
  add(14,21,T.PARK,0);add(15,21,T.PARK,0);add(21,21,T.PARK,0);
  add(27,16,T.POWER,0);add(28,16,T.POWER,0);
}
function newCity(){
  for(var z=0;z<N;z++)for(var x=0;x<N;x++)clearTile(x,z);
  money=20000;day=0;goalIdx=0;tax=9;happy=62;budget={inc:0,exp:0,has:false};
  $('tax').value=9;$('taxO').textContent='9%';
  cityName=CITY_NAMES[(Math.random()*CITY_NAMES.length)|0];$('cityName').textContent=cityName;
  rankIdx=0;seed();scatterDecor();stats=computeStats();syncCars();syncPeds();hud();save();
  note('A fresh start. Roads first, then zones beside them.');
}
document.addEventListener('visibilitychange',function(){if(document.hidden)save()});
window.addEventListener('pagehide',save);

/* ---------- sky dome, stars, cloud shadows ---------- */
var skyU={top:{value:new THREE.Color('#3f86d6')},bot:{value:new THREE.Color('#bfe0f5')},sd:{value:new THREE.Vector3(0,1,0)},sc:{value:new THREE.Color('#ffe2b0')},si:{value:1}};
var dome=new THREE.Mesh(new THREE.SphereGeometry(300,32,16),new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,fog:false,
  vertexShader:'varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 top;uniform vec3 bot;uniform vec3 sd;uniform vec3 sc;uniform float si;varying vec3 vD;void main(){float h=clamp(vD.y,0.,1.);vec3 col=mix(bot,top,pow(h,.55));float s=max(dot(vD,normalize(sd)),0.);col+=sc*si*(pow(s,10.)*.35+pow(s,200.)*1.6);gl_FragColor=vec4(col,1.);}'}));
dome.renderOrder=-10;dome.frustumCulled=false;scene.add(dome);
var stars=(function(){
  var n=500,pos=new Float32Array(n*3),r=rng(99);
  for(var i=0;i<n;i++){var a=r()*6.283,y=.08+r()*.92,xz=Math.sqrt(1-y*y);pos[i*3]=Math.cos(a)*xz*280;pos[i*3+1]=y*280;pos[i*3+2]=Math.sin(a)*xz*280}
  var g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  var p=new THREE.Points(g,new THREE.PointsMaterial({color:'#ffffff',size:1.6,sizeAttenuation:false,transparent:true,opacity:0,depthWrite:false,fog:false}));
  p.frustumCulled=false;p.renderOrder=-9;scene.add(p);return p;
})();
/* invisible clouds that only cast drifting shadows, so they never block the view */
var cloudMat=new THREE.MeshBasicMaterial({colorWrite:false,depthWrite:false}),clouds=[];
(function(){
  var r=rng(21);
  for(var i=0;i<9;i++){
    var g=new THREE.Group(),n=3+((r()*3)|0);
    for(var k=0;k<n;k++){var m=new THREE.Mesh(new THREE.IcosahedronGeometry(2+r()*1.8,0),cloudMat);m.position.set(k*3-n*1.4,(r()-.5)*.6,(r()-.5)*2.4);m.scale.y=.45;m.castShadow=true;g.add(m)}
    g.position.set((r()-.5)*110,16+r()*5,(r()-.5)*90);g.userData.v=.5+r()*.5;scene.add(g);clouds.push(g);
  }
})();
function updateClouds(dt){for(var i=0;i<clouds.length;i++){var g=clouds[i];g.position.x+=dt*g.userData.v;if(g.position.x>60)g.position.x=-60}}
var skyNightTop=new THREE.Color('#040916'),skyDayTop=new THREE.Color('#3f86d6'),skyDuskTop=new THREE.Color('#6a5a9a'),skyTop=new THREE.Color(),skyBot=new THREE.Color(),whiteC=new THREE.Color('#ffffff'),negSun=new THREE.Vector3();

/* ---------- day / night ---------- */
var skyDay=new THREE.Color('#8cc5ec'),skyNight=new THREE.Color('#0a1230'),skySet=new THREE.Color('#ee9560'),tmpC=new THREE.Color();
var sunDir=new THREE.Vector3();
function updateSky(){
  var a=(tod-.25)*Math.PI*2,se=Math.sin(a);
  sunDir.set(Math.cos(a)*.8,se,.45).normalize();
  var d=clamp((se+.08)/.33,0,1),night=1-d;
  tmpC.copy(skyNight).lerp(skyDay,d);
  var dusk=Math.max(0,1-Math.abs(se)/.28)*.55;tmpC.lerp(skySet,dusk);
  skyBot.copy(tmpC).lerp(whiteC,.22*d);
  skyTop.copy(skyNightTop).lerp(skyDayTop,d).lerp(skyDuskTop,dusk*.4);
  skyU.top.value.copy(skyTop);skyU.bot.value.copy(skyBot);
  var below=se<-.05;
  skyU.sd.value.copy(below?negSun.copy(sunDir).negate():sunDir);
  skyU.sc.value.set(below?'#cfd8ff':'#ffe2b0');
  skyU.si.value=below?.55*night:clamp((se+.1)*2,0,1)*(1-dusk*.3);
  stars.material.opacity=clamp(night*1.3-.1,0,1);
  dome.position.copy(camera.position);stars.position.copy(camera.position);
  if(bloom)bloom.strength=.1+.7*clamp(night*1.5,0,1);
  scene.background.copy(skyBot);scene.fog.color.copy(skyBot);
  sun.position.set(cam.tx+sunDir.x*60,Math.max(sunDir.y,.08)*60,cam.tz+sunDir.z*60);sun.target.position.set(cam.tx,0,cam.tz);
  sun.intensity=1.05*d;sun.color.set('#fff1d6').lerp(new THREE.Color('#ffb070'),dusk);
  hemi.intensity=.22+.5*d;moon.intensity=.32*night;moon.position.set(-sunDir.x*40,Math.abs(sunDir.y)*40+10,-sunDir.z*40);
  var glow=clamp(1-(se+.04)/.3,0,1);
  for(var i=0;i<winMats.length;i++)winMats[i].emissiveIntensity=glow*1.25;
  lampMat.color.set('#9aa3aa').lerp(new THREE.Color('#ffe39a'),glow);
}

/* ---------- main loop ---------- */
var last=performance.now(),clockT=0;
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min((now-last)/1000,.05);last=now;time+=dt;
  tod=(tod+dt/150)%1;
  /* keyboard camera */
  var kx=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0),kz=(keys['s']||keys['arrowdown']?1:0)-(keys['w']||keys['arrowup']?1:0);
  if(kx||kz){var sp=cam.dist*.9*dt,rx=Math.cos(cam.yaw),rz=-Math.sin(cam.yaw),fx=-Math.sin(cam.yaw),fz=-Math.cos(cam.yaw);cam.tx=clamp(cam.tx+(rx*kx-fx*kz)*sp,-HALF,HALF);cam.tz=clamp(cam.tz+(rz*kx-fz*kz)*sp,-HALF,HALF)}
  if(keys['q'])cam.yaw+=dt*1.4;if(keys['e'])cam.yaw-=dt*1.4;
  if(keys['=']||keys['+'])cam.dist=clamp(cam.dist*(1-dt*1.2),16,80);if(keys['-'])cam.dist=clamp(cam.dist*(1+dt*1.2),16,80);
  applyCam();updateSky();
  /* sim */
  if(speed>0){simAcc+=dt*speed/DAY;var guard=0;while(simAcc>=1&&guard++<4){simDay();simAcc-=1}if(simAcc>4)simAcc=0}
  /* buildings: grow-in, blinkers, emitters */
  var blinkOn=(Math.floor(time*1.3)%2)===0;
  for(var i=0;i<grid.length;i++){
    var o=grid[i].obj;if(!o)continue;
    var age=time-o.userData.born;
    if(age<.7){var u=clamp(age/.7,0,1),e=1+2.2*Math.pow(u-1,3)+1.2*Math.pow(u-1,2);o.scale.y=Math.max(.001,u<=0?0.001:e)}
    else if(o.scale.y!==1)o.scale.y=1;
    var ud=o.userData;
    if(ud.blink){for(var b=0;b<ud.blink.length;b++)ud.blink[b].visible=blinkOn}
    if(ud.emit&&age>.7){for(var q=0;q<ud.emit.length;q++){var em=ud.emit[q];if(Math.random()<dt*(em.k==='steam'?2.2:1.2))spawnPuff(o.position.x+em.x,em.y,o.position.z+em.z,em.k)}}
  }
  for(var p=0;p<puffs.length;p++){
    var pf=puffs[p];if(!pf.on)continue;pf.age+=dt;var l=pf.age/pf.max;
    if(l>=1){pf.on=false;pf.m.visible=false;continue}
    pf.m.position.y+=dt*.32;pf.m.position.x+=dt*pf.vx;pf.m.scale.setScalar(.6+l*2.2);pf.m.material.opacity=(pf.k==='steam'?.5:.42)*(1-l);
  }
  animFires(dt);updateClouds(dt);updateCars(cars,dt,.14);updateCars(peds,dt,.4);updateBoats(dt);
  clockT+=dt;if(clockT>.5){clockT=0;var hrs=tod*24,hh=Math.floor(hrs),mm=Math.floor((hrs-hh)*60);$('clock').textContent=(hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm}
  if(composer&&fxOn)composer.render();else renderer.render(scene,camera);
  fxAcc+=dt;fxN++;
  if(fxAcc>5){
    if(composer&&fxOn&&!window.__keepFX&&fxAcc/fxN>.045){fxOn=false;note('Effects turned off to keep things smooth. Press X to try them again.')}
    fxAcc=0;fxN=0;
  }
}

/* ---------- boot ---------- */
$('cityName').textContent=cityName;
initDecor();
if(!load()){seed()}
else{$('cityName').textContent=cityName;$('tax').value=tax;$('taxO').textContent=tax+'%'}
scatterDecor();stats=computeStats();syncCars();syncPeds();hud();setTool('road');
requestAnimationFrame(function(t){last=t;frame(t)});
setTimeout(function(){note('Zone beside a road, add power, and watch lots fill in.')},900);
setTimeout(function(){var h=$('hint');if(h)h.style.opacity=0;h.style.transition='opacity 1s'},14000);
})();
